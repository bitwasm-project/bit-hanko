name: Feature request
description: Something this should do and does not
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do that you cannot do now
      description: Include the wallet app you pair it with, if that matters.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you would like instead
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: I have read the roadmap (docs/roadmap.md) and this is not already planned
        - label: This affects what is signed or shown on the review screen (rather than convenience)
